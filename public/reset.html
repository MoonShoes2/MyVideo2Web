<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0F13" />
    <title>追影 · 修复工具</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #0e0f13;
        color: #f5f6f8;
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        padding: calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 32px);
      }
      h1 { font-size: 19px; margin: 0 0 6px; }
      p { margin: 0 0 14px; color: #9a9ca8; font-size: 13px; }
      .card { background: #15171d; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
      .row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
      .row span:last-child { color: #9a9ca8; text-align: right; word-break: break-all; }
      button {
        display: block; width: 100%; padding: 14px; border: 0; border-radius: 22px;
        font-size: 15px; font-weight: 600; color: #fff; cursor: pointer;
        background: #ff6a2b; margin-top: 10px;
      }
      button.ghost { background: #272a34; }
      button:disabled { opacity: .5; }
      .ok { color: #3fbf7f; }
      .warn { color: #ffb020; }
      #log {
        white-space: pre-wrap; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
        color: #9a9ca8; background: #0b0c0f; border-radius: 10px; padding: 12px;
        margin-top: 12px; max-height: 42vh; overflow: auto;
      }
      .tip { font-size: 12px; color: #6b6e7b; }
    </style>
  </head>
  <body>
    <h1>追影 · 修复工具</h1>
    <p>
      清理「已安装应用」里卡住的旧缓存和 Service Worker。<b>不会删除收藏、观看历史和设置</b>。
    </p>

    <div class="card">
      <div class="row"><span>当前页面版本</span><span id="ver">读取中…</span></div>
      <div class="row"><span>Service Worker</span><span id="sw">检查中…</span></div>
      <div class="row"><span>缓存分区</span><span id="cache">检查中…</span></div>
      <div class="row"><span>运行环境</span><span id="mode">—</span></div>
    </div>

    <div class="card">
      <button id="go">清理缓存并重新加载</button>
      <button id="hard" class="ghost">连离线下载一起清空</button>
      <p class="tip" style="margin: 12px 0 0">
        清理完成后，回到桌面重新打开「追影」。如果图标仍是带状态栏的旧版本，
        需要卸载重装才能拿到全屏配置。
      </p>
    </div>

    <div id="log">开始检查…</div>

    <script>
      const $ = (id) => document.getElementById(id)
      const log = (msg) => {
        $('log').textContent += '\n' + msg
        $('log').scrollTop = $('log').scrollHeight
      }

      async function status() {
        try {
          const r = await fetch('/version.json?t=' + Date.now(), { cache: 'no-store' })
          $('ver').textContent = r.ok ? (await r.json()).build : '读取不到'
        } catch {
          $('ver').textContent = '读取不到（可能离线）'
        }

        try {
          const regs = (await navigator.serviceWorker.getRegistrations()).filter(
            (r) => new URL(r.scope).origin === location.origin,
          )
          $('sw').textContent = regs.length ? regs.length + ' 个已注册' : '无'
        } catch {
          $('sw').textContent = '不支持'
        }

        try {
          const keys = await caches.keys()
          $('cache').textContent = keys.length ? keys.join(', ') : '空'
        } catch {
          $('cache').textContent = '不支持'
        }

        const mode =
          matchMedia('(display-mode: fullscreen)').matches ? '全屏应用'
          : matchMedia('(display-mode: standalone)').matches ? '独立窗口（带状态栏）'
          : '浏览器标签页'
        $('mode').textContent = mode
      }

      async function clean({ media }) {
        $('go').disabled = $('hard').disabled = true
        log('— 开始清理 —')
        try {
          const regs = await navigator.serviceWorker.getRegistrations()
          for (const reg of regs) {
            if (new URL(reg.scope).origin !== location.origin) continue
            log('注销 SW：' + reg.scope)
            await reg.unregister()
          }
        } catch (e) {
          log('注销 SW 失败：' + e.message)
        }
        try {
          const keys = await caches.keys()
          for (const k of keys) {
            if (!media && k === 'zy-media-v1') {
              log('保留离线分片：' + k)
              continue
            }
            log('删除缓存：' + k)
            await caches.delete(k)
          }
        } catch (e) {
          log('清理缓存失败：' + e.message)
        }
        log('完成，正在重新加载…')
        await status()
        setTimeout(() => location.reload(), 600)
      }

      $('go').onclick = () => clean({ media: false })
      $('hard').onclick = () => {
        if (confirm('会连已下载的影片一起删掉，确定？')) clean({ media: true })
      }
      status()
    </script>
  </body>
</html>
